<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        // Kalp dış çizgisi matematiksel formülü
        function getHeartPoint(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x, y };
        }

        const particles = [];

        // 1. Dış çizgi kelimeleri (Kalp şeklini oluşturan ana hat)
        const outlineCount = 60;
        for (let i = 0; i < outlineCount; i++) {
            const t = (i / outlineCount) * Math.PI * 2;
            const pt = getHeartPoint(t);
            particles.push({
                xFactor: pt.x,
                yFactor: pt.y,
                text: phrases[i % phrases.length],
                size: 13,
                isOutline: true,
                offset: i * 0.1
            });
        }

        // 2. İç kısım kelimeleri (Kalbin içini dolduranlar)
        const innerCount = 90;
        for (let i = 0; i < innerCount; i++) {
            const t = Math.random() * Math.PI * 2;
            const pt = getHeartPoint(t);
            // Kalbin içine doğru çekme oranı (0.1 ile 0.85 arası)
            const shrink = 0.15 + Math.random() * 0.7; 
            particles.push({
                xFactor: pt.x * shrink,
                yFactor: pt.y * shrink,
                text: phrases[Math.floor(Math.random() * phrases.length)],
                size: Math.floor(9 + Math.random() * 3),
                isOutline: false,
                offset: Math.random() * 10
            });
        }

        let time = 0;

        function animate() {
            ctx.fillStyle = '#060208';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            const scale = Math.min(canvas.width, canvas.height) / 40;
            time += 0.03;
            const pulse = 1 + Math.sin(time * 2) * 0.04;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            particles.forEach((p) => {
                const x = p.xFactor * scale * pulse;
                const y = p.yFactor * scale * pulse;

                // Yanıp sönme parlaklığı
                const alpha = p.isOutline 
                    ? 0.8 + 0.2 * Math.sin(time * 3 + p.offset) 
                    : 0.4 + 0.5 * Math.sin(time * 2 + p.offset);

                ctx.font = `bold ${p.size}px Arial`;

                if (p.isOutline) {
                    ctx.fillStyle = `rgba(255, 30, 80, ${alpha})`;
                    ctx.shadowBlur = 12;
                    ctx.shadowColor = '#ff0044';
                } else {
                    ctx.fillStyle = `rgba(210, 20, 60, ${alpha})`;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#d2143c';
                }

                ctx.fillText(p.text, x, y);
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
