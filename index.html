        class Random {
            constructor(seed) { this.m = 0x80000000; this.a = 1103515245; this.c = 12345; this.state = seed; }
            nextFloat() { this.state = (this.a * this.state + this.c) % this.m; return this.state / (this.m - 1); }
            uniform(min, max) { return min + (max - min) * this.nextFloat(); }
            choice(array) { return array[Math.floor(this.nextFloat() * array.length)]; }
            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(this.nextFloat() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }
        }

        const rng = new Random(11);

        function heart(a) {
            const x = 16 * Math.pow(Math.sin(a), 3);
            const y = 13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a);
            return [x * SC, y * SC + OY];
        }

            const r = Math.floor(Math.max(0, Math.min(1, c[0])) * 255);
            const g = Math.floor(Math.max(0, Math.min(1, c[1])) * 255);
            const b = Math.floor(Math.max(0, Math.min(1, c[2])) * 255);
            return `rgb(${r},${g},${b})`;
        }

            return [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        }

            return [c[0] * k, c[1] * k, c[2] * k];

        function spans(y) {
            const xs = [];

                if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {

                }
            }
            xs.sort((a, b) => a - b);
            const result = [];
            for (let i = 0; i < xs.length; i += 2) {
                if (xs[i + 1] !== undefined) result.push([xs[i], xs[i + 1]]);
            }
            return result;
        }

            const out = [];
            for (let a of A) {
                for (let b of B) {

                    if (hi - lo > 14) out.push([lo, hi]);
                }
            }
            return out;
        }
