<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Heart</title>
    <style>
        body {
            margin: 0;
            background-color: #060208;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>
    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const phrases = [
            "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
            "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
            "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
            "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
            "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
        ];

        // Kalp formülü
        function getHeartPoint(t, scale) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
            return { x: x * scale, y: y * scale };
        }

        const particles = [];
        const count = 200; // Tıklım tıklım dolu olması için kelime sayısı

        for (let i = 0; i < count; i++) {
            const t = Math.random() * Math.PI * 2;
            const r = Math.pow(Math.random(), 0.5); // Kalbin içini dolduran dağılım
            particles.push({
                t: t,
                r: r,
                text: phrases[Math.floor(Math.random() * phrases.length)],
                size: Math.floor(9 + Math.random() * 4),
                offset: Math.random() * 100
            });
        }

        let time = 0;

        function animate() {
            ctx.fillStyle = '#060208';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);

            const baseScale = Math.min(canvas.width, canvas.height) / 38;
            time += 0.03;
            const pulse = 1 + Math.sin(time * 2) * 0.04;

            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            particles.forEach((p) => {
                const pScale = baseScale * pulse;
                const pt = getHeartPoint(p.t, pScale);
                
                const x = pt.x * p.r;
                const y = pt.y * p.r;

                const alpha = 0.5 + 0.5 * Math.sin(time * 2 + p.offset);
                
                ctx.font = `bold ${p.size}px Arial`;
                ctx.fillStyle = `rgba(235, 20, 60, ${alpha})`;
                
                // Parıltı efekti
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ff1a53';

                ctx.fillText(p.text, x, y);
            });

            ctx.restore();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
